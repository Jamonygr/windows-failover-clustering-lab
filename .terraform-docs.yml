formatter: markdown table

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: false
  required: true
  sensitive: true
  type: true

sort:
  enabled: true
  by: name

# Output goes to stdout; scripts/generate-terraform-docs.ps1 owns the target
# file and header per directory.
